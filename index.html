<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101214" />
  <title>Drumit — Drum & Stage Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <button class="icon-button mobile-only" id="libraryToggle" aria-label="Toggle equipment library">☰</button>
        <div class="brand-mark">D</div>
        <div>
          <div class="brand-name">Drumit</div>
          <input id="projectName" class="project-name" value="My Drum Setup" aria-label="Project name" />
        </div>
      </div>

      <div class="toolbar" role="toolbar" aria-label="Project controls">
        <button class="tool-button" id="newProjectBtn">New</button>
        <button class="tool-button" id="demoBtn">Demo Kit</button>
        <button class="tool-button" id="saveBtn">Save</button>
        <button class="tool-button" id="loadBtn">Load</button>
        <span class="toolbar-divider"></span>
        <button class="icon-button" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶</button>
        <button class="icon-button" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
        <span class="toolbar-divider"></span>
        <button class="tool-button stage-button" id="stageBtn">Stage</button>
        <button class="tool-button" id="cleanViewBtn">Clean View</button>
        <span class="toolbar-divider"></span>
        <button class="icon-button" id="zoomOutBtn" title="Zoom out">−</button>
        <button class="zoom-readout" id="zoomReadout">100%</button>
        <button class="icon-button" id="zoomInBtn" title="Zoom in">+</button>
        <button class="tool-button" id="fitBtn">Fit</button>
        <button class="tool-button primary" id="exportBtn">Export PNG</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="library-panel" id="libraryPanel">
        <div class="panel-heading">
          <div>
            <h2>Equipment</h2>
            <p>Drag items onto the stage</p>
          </div>
          <button class="icon-button mobile-only" id="libraryClose" aria-label="Close equipment library">×</button>
        </div>
        <div class="library-search-wrap">
          <input id="librarySearch" class="library-search" type="search" placeholder="Search drums, cymbals, hardware…" />
        </div>
        <div id="libraryContent" class="library-content"></div>
      </aside>

      <section class="workspace-wrap">
        <div class="workspace-status">
          <div class="mode-pill">DESIGN</div>
          <div id="selectionReadout">Nothing selected</div>
          <div class="status-spacer"></div>
          <label class="compact-control"><input id="gridToggle" type="checkbox" checked /> Grid</label>
          <label class="compact-control"><input id="snapToggle" type="checkbox" /> Snap</label>
          <select id="snapSize" class="status-select" title="Snap grid size">
            <option value="5">5 cm</option>
            <option value="10" selected>10 cm</option>
            <option value="25">25 cm</option>
            <option value="50">50 cm</option>
          </select>
          <span id="stageReadout">6.0 × 4.0 m</span>
          <span id="objectCount">0 items</span>
        </div>

        <div id="workspaceViewport" class="workspace-viewport" tabindex="0" aria-label="Drum and stage layout workspace">
          <svg id="workspaceSvg" class="workspace-svg" xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
            <defs>
              <radialGradient id="cymbalGradient" cx="42%" cy="36%" r="70%">
                <stop offset="0" stop-color="#fff5bf" />
                <stop offset="0.42" stop-color="#e5b94f" />
                <stop offset="0.78" stop-color="#b78128" />
                <stop offset="1" stop-color="#74501d" />
              </radialGradient>
              <radialGradient id="drumGradient" cx="45%" cy="38%" r="66%">
                <stop offset="0" stop-color="#fbfcfd" />
                <stop offset="0.7" stop-color="#d4dce2" />
                <stop offset="1" stop-color="#8d969d" />
              </radialGradient>
              <linearGradient id="hardwareGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#edf1f3" />
                <stop offset="0.45" stop-color="#89939a" />
                <stop offset="1" stop-color="#434a50" />
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.32" />
              </filter>
              <pattern id="gridPattern" width="10" height="10" patternUnits="userSpaceOnUse">
                <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#394148" stroke-width="0.7" />
              </pattern>
            </defs>
            <g id="stageTransform">
              <rect id="stageShadow" x="0" y="0" width="600" height="400" rx="5" fill="#000" opacity=".3" transform="translate(10 12)" />
              <rect id="stageBackground" x="0" y="0" width="600" height="400" rx="5" fill="#1a1e22" stroke="#56616a" stroke-width="2" />
              <rect id="gridLayer" x="0" y="0" width="600" height="400" rx="5" fill="url(#gridPattern)" opacity=".5" pointer-events="none" />
              <g id="riserLayer" pointer-events="none"></g>
              <g id="stageGuides" pointer-events="none"></g>
              <g id="objectLayer"></g>
              <g id="stageInteractionLayer"></g>
            </g>
          </svg>
        </div>

        <div class="floating-tools" id="floatingTools" hidden>
          <button id="duplicateBtn" title="Duplicate">Duplicate</button>
          <button id="rotateLeftBtn" title="Rotate left 15°">−15°</button>
          <button id="rotateRightBtn" title="Rotate right 15°">+15°</button>
          <button id="backBtn" title="Send backward">Back</button>
          <button id="frontBtn" title="Bring forward">Front</button>
          <button id="lockBtn" title="Lock / unlock">Lock</button>
          <button id="propertiesBtn" title="Object properties">Properties</button>
          <button id="deleteBtn" class="danger" title="Delete">Delete</button>
        </div>
      </section>

      <aside class="properties-panel" id="propertiesPanel" aria-hidden="true">
        <div class="panel-heading">
          <div>
            <h2 id="propertiesTitle">Properties</h2>
            <p id="propertiesSubtitle">Edit the selected component</p>
          </div>
          <button class="icon-button" id="propertiesClose" aria-label="Close properties">×</button>
        </div>
        <div id="propertiesContent" class="properties-content"></div>
      </aside>
    </main>

    <footer class="footerbar">
      <span>Drag equipment · wheel/pinch zoom · Space + drag pan · R rotates · arrows nudge</span>
      <span>Ctrl/Cmd+Z undo · Ctrl/Cmd+D duplicate · Delete remove</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="riser.js"></script>
  <script src="touch.js"></script>
</body>
</html>
